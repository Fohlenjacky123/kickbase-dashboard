name: Kickbase-Daten sammeln

on:
  schedule:
    # Alle 6 Stunden (UTC). GitHub startet Cron-Jobs manchmal etwas verzögert.
    - cron: '15 */6 * * *'
  workflow_dispatch:        # erlaubt manuelles Starten per Knopfdruck

# Verhindert, dass sich zwei Läufe gleichzeitig ins Gehege kommen
concurrency:
  group: kickbase-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # nötig, damit der Roboter die Daten zurückschreiben darf
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Daten abrufen
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASSWORD: ${{ secrets.KICKBASE_PASSWORD }}
          KICKBASE_LEAGUES: ${{ vars.KICKBASE_LEAGUES }}
        run: node collector/collect.mjs

      - name: Änderungen sichern
        run: |
          git config user.name  "Kickbase Archiv"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Datenstand $(date -u '+%d.%m.%Y %H:%M') UTC"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
